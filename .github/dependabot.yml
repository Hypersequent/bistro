version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'all-dependencies'
    groups:
      npm-security:
        applies-to: 'security-updates'
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'all-dependencies'
    groups:
      actions-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
