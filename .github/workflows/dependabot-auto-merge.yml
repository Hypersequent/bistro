name: Dependabot auto-merge

# workflow_run executes the version of this workflow from the default branch.
# PR code is installed and formatted without persisted credentials. The write
# token is exposed only after CI has tested the same formatted working tree.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: Verify current Dependabot PR
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_author="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login')"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"

          if [[ "$pr_author" != 'dependabot[bot]' ]]; then
            echo "Skipping PR #${PR_NUMBER}: author is ${pr_author}."
            exit 0
          fi

          if [[ "$current_sha" != "$TESTED_SHA" ]]; then
            echo "Skipping PR #${PR_NUMBER}: CI did not test the current head."
            exit 0
          fi

          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Checkout tested PR commit
        if: steps.verify.outputs.verified == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Node.js
        if: steps.verify.outputs.verified == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: steps.verify.outputs.verified == 'true'
        run: |
          npm ci
          git diff --exit-code

      - name: Apply formatting
        if: steps.verify.outputs.verified == 'true'
        run: npm run format

      - name: Commit formatting and merge
        if: steps.verify.outputs.verified == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --update
            git commit --no-verify -m 'chore(deps): apply formatting after dependency bump'
            git push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_BRANCH}"
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          echo 'merged=true' >> "$GITHUB_OUTPUT"

      - name: Deploy the updated main branch
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
